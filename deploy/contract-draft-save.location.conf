# 仅将本段合入现有前端 Nginx 的 server {}，或在该 server 内 include 此文件。
# 原业务、SSE、文件下载、PDF 和 SPA location 全部保留。
# 本文件不可作为完整 nginx.conf 使用；不含 appkey/secretkey，凭据由本次前端请求携带。
location = /contract-draft-api/saveZDSingle {
    proxy_pass http://10.100.10.19:18100/exchangeAuthCenter/exchangeContractInfo/saveZDSingle;
    proxy_http_version 1.1;
    proxy_set_header Host 10.100.10.19:18100;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_cache off;
    client_max_body_size 128k;
    # 原样转发 JSON 请求体和合同平台响应，前端按业务 code 判定并弹窗 message。
}
